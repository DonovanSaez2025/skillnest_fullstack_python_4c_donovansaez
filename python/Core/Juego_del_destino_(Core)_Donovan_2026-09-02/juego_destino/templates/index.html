<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Autor de la página -->
    <meta name="author" content="donovansaez@liceovvh.cl">
    <!-- Estilos Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Estilos específicos -->
    <link rel="stylesheet" href={{ url_for("static", filename="css/style.css") }}>
    <!-- Título de la página -->
    <title>Juego del Destino</title>
</head>

<!-- Cuerpo de la página -->
<body class="text-center bg-dark">
    <!-- Contenedor -->
    <main class="container mx-auto">
        <!-- Caja central -->
        <section>
            <!-- Caja de fondo -->
            <div class="text-light">
                <header class="header gradiente-header py-3">
                    <div class="d-flex justify-content-center"><i class="bi bi-moon-fill fs-4"></i></div>
                    <h1 class="fs-2">El Juego del Destino</h1>
                    <p class="header-parrafo">Descubre qué te depara el futuro</p>
                </header>
            </div>
            <div class="caja-inferior">
                <form method="POST" action={{ url_for("procesar") }} class="p-3 mx-auto d-flex flex-column">
                    <div class="grupos-form mb-3">
                        <div class="mx-auto d-flex justify-content-between p-2 rounded-4">
                            <label for="nombre"><i class="bi bi-person-fill"></i> Tu nombre</label>
                            <input name="nombre" id="nombre" type="text">
                        </div>
                    </div>
                    <div class="grupos-form mb-3">
                        <div class="mx-auto d-flex justify-content-between p-2 rounded-4">
                            <label for="edad"><i class="bi bi-calendar-fill"></i> Tu edad</label>
                            <input name="edad" id="edad" type="number">
                        </div>
                    </div>
                    <div class="grupos-form">
                        <div class="mx-auto d-flex justify-content-between p-2 rounded-4">
                            <label for="color"><i class="bi bi-palette-fill"></i> Tu color favorito</label>
                            <input name="color" id="color" type="color">
                        </div>
                        <span class="notice">Ej: Rojo, azul, verde, morado, amarillo...</span>
                    </div>
                    <div class="grupos-form mt-3">
                        <div class="mx-auto d-flex justify-content-between p-2 rounded-4 animal">
                            <label for="animal">🐾 Tu animal favorito</label>
                            <input name="animal" id="animal" type="text">
                        </div>
                        <span class="notice">Ej: Perro, gato, águila, león, delfín...</span>
                    </div>
                    <div>
                        <img class="img" src={{ url_for("static", filename="img/boladecristal.png")}}>
                    </div>
                        <button type="submit" class="enviar text-light py-2 rounded-3"><i class="bi bi-pencil-fill"></i> Revelar mi destino</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Script JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
