<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Autor de la página -->
    <meta name="author" content="donovansaez@liceovvh.cl">
    <!-- Estilos Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Estilos específicos -->
    <link rel="stylesheet" href={{ url_for("static", filename="css/style.css") }}>
    <!-- Título de la página -->
    <title>Juego del Destino</title>
</head>

<!-- Cuerpo de la página -->
<body class="text-center bg-dark">
    <!-- Contenedor -->
    <main class="container mx-auto">
        <!-- Caja central -->
        <section>
            <!-- Caja de fondo -->
            <div class="text-light">
                <header class="header gradiente-header py-3">
                    <div class="d-flex justify-content-center"><i class="bi bi-brightness-high-fill fs-4"></i></div>
                    <h1 class="fs-2">Tu Destino ha sido Revelado</h1>
                    <p class="header-parrafo">Las estrellas han hablado, {{ nombre }}</p>
                </header>
            </div>
            <div class="caja-inferior">
                <div class="p-3 mx-auto d-flex flex-column">
                    <div class="">
                        {{ respuesta }}
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Script JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
