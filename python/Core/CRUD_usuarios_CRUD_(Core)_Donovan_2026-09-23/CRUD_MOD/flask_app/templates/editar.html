<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="donovansaez@liceovvh.cl">
    <title>Editar Usuario {{ usuario.id }}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Local CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <!-- Contenedor de la página -->
    <div class="container py-5">
        <div class="form-card">
            <div class="mb-4">
                <h1>Editar Usuario {{ usuario.id }}</h1>
                <p class="text-muted">Modifica los datos del usuario.</p>
            </div>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <!-- Formulario para actualizar los datos del usuario -->
            <form action="{{ url_for('actualizar', id=usuario.id) }}" method="POST">
                <div class="mb-3">
                    <label for="nombre_usuario" class="form-label">Nombre</label>
                    <input type="text" id="nombre_usuario" name="nombre_usuario" class="form-control" maxlength="45" value="{{ usuario.nombre_usuario }}" required>
                </div>

                <div class="mb-3">
                    <label for="apellido_usuario" class="form-label">Apellido</label>
                    <input type="text"  id="apellido_usuario" name="apellido_usuario" class="form-control" maxlength="45" value="{{ usuario.apellido_usuario }}" required>
                </div>

                <div class="mb-4">
                    <label for="email_usuario" class="form-label">E-mail</label>
                    <input type="email_usuario" id="email_usuario" name="email_usuario" class="form-control" maxlength="45" value="{{ usuario.email_usuario }}" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Actualizar</button>
                    <a href="{{ url_for('detalle', id=usuario.id) }}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
