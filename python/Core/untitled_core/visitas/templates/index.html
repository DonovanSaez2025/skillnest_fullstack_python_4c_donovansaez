<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="donovansaez@liceovvh.cl">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %}Visitas{% endblock %}</title>
</head>

<body class="text-center bg-secondary">
    <header class="bg-primary p-2 border-bottom border-3">
        <h1 class="text-light">El contador de visitar</h1>
    </header>

    <!-- Contenedor -->
    <main class="container">
        <!-- Fila 1 -->
        <section class="row">
            <div class="mt-3 p-2 bg-warning mx-auto border border-4 rounded-5" style="max-width: 400px;">
                <h2 class="">Visitas de la página</h2>
            </div>
        </section>

        <!-- Fila 2 -->
        <section class="row">
            <div class=" mt-3 bg-primary rounded-5 border border-4 mx-auto" style="max-width: 300px;">
                <span class="text-light" style="font-size: 8rem;">{{ counter }}</span>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
