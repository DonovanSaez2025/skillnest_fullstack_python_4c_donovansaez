<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuario {{ usuario.nombre }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="welcome-container">
        <h1>¡Hola, {{ usuario.nombre }} {{ usuario.apellido }}!</h1>

        <p>Edad: <strong>{{ usuario.edad }} años</strong></p>
        <a href="{{ url_for('logout') }}" class="logout-link">Cerrar Sesión</a>
    </div>
</body>
</html>
