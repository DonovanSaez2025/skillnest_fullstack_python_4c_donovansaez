<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Mercado de Frutas</title>
</head>

<body>
    <!-- Barra de navegación -->
    <nav>
        <!-- Contenedor de la barra de navegación -->
        <div class="nav-cont">
            <!-- Parte izquierda de la barra -->
            <div class="nav-left">
                <img src="{{ url_for('static', filename='img/headericon.png') }}" alt="Ícono manzana">
                <h1>Mercado de Frutas</h1>
            </div>
            <!-- Parte derecha de la barra -->
            <div class="nav-right">
                <a href="/" class="in-page">Inicio</a>
                <a href="/frutas.html">Catálogo</a>
            </div>
        </div>
    </nav>
    <!-- Banner -->
    <header>
        <!-- Contenedor de header -->
        <div class="h-cont">
            <h2>Frutas Frescas a Tu Puerta</h2>
            <p>Selecciona tus frutas favoritas y realiza tu pedido</p>
        </div>
    </header>

    <!-- Contenedor -->
    <main class="container">
        <div class="back-box">
            <!-- Columna izquierda -->
            <section class="column-l column">
                <div class="up-part">
                    <h3>Selecciona tus frutas</h3>
                </div>
                <!-- Caja que contendrá las tarjetas -->
                <div class="card-box">
                    <!-- Tarjeta -->
                    <div class="card">
                        <div class="card-img-bg">
                            <img src="{{ url_for('static', filename='img/manzana.png') }}">
                        </div>
                        <div class="card-desc">
                            <h4>Manzana</h4>
                            <span class="card-price">$2.5</span>
                            <span class="fruit-desc">Fruta dulce y crujiente, rica en fibra y vitamina C.</span>
                            <div class="fruit-cant">
                                <button id="apple-remove" class="card-button c-button-l">-</button>
                                <input type="number" placeholder="0" class="cant-int"></input>
                                <button id="apple-add" class="card-button c-button-r">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Columna derecha-->
            <section class="column-r column">
                <div class="up-part">
                    <h3>Información de Contacto</h3>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
